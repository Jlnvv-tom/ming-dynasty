name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # pnpm 版本读取 package.json 的 packageManager 字段，与本地保持一致
      - name: 准备 pnpm
        uses: pnpm/action-setup@v4

      # Node 22 为 pnpm 11 的硬性要求（其内部依赖 node:sqlite，Node 20 会直接报
      # ERR_UNKNOWN_BUILTIN_MODULE），也是 Next 15 支持的 LTS 版本
      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        # pnpm 11 在 CI 下默认开启 strict-dep-builds，若依赖的构建脚本未获批准
        # 会直接失败（ERR_PNPM_IGNORED_BUILDS: esbuild、unrs-resolver）。
        # 实测该策略不信任项目内的 .npmrc / pnpm-workspace.yaml，只能由命令行参数放宽。
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false

      - name: 构建原生依赖
        # 显式重建，确保 tsx（ETL 脚本）与 eslint 所需的二进制真正就绪
        run: pnpm rebuild esbuild unrs-resolver

      - name: 类型检查
        run: pnpm typecheck

      - name: 代码检查
        run: pnpm lint

      - name: 从源表重新生成数据
        run: pnpm data:import

      - name: 数据校验
        run: pnpm data:check

      - name: 静态构建
        run: pnpm build

      - name: 配置 Pages
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
