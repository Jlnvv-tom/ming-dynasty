name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # pnpm 11 的构建策略（strict-dep-builds）与运行前依赖校验
      # （verify-deps-before-run）在 CI 下默认开启，会因 esbuild、
      # unrs-resolver 的构建脚本未获批准而失败。
      # 这两项设置不信任项目内配置文件，只能由命令行参数/环境变量放宽；
      # 本工作流同时用环境变量兜底，并改用 pnpm exec 直接执行，
      # 不经过 pnpm 的脚本前置检查（runDepsStatusCheck），从根本上规避。
      npm_config_verify_deps_before_run: 'false'
      npm_config_strict_dep_builds: 'false'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # pnpm 版本读取 package.json 的 packageManager 字段，与本地保持一致
      - name: 准备 pnpm
        uses: pnpm/action-setup@v4

      # Node 22 为 pnpm 11 的硬性要求（其内部依赖 node:sqlite，Node 20 会直接报
      # ERR_UNKNOWN_BUILTIN_MODULE），也是 Next 15 支持的 LTS 版本
      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false --config.verify-deps-before-run=false

      - name: 构建原生依赖
        run: pnpm rebuild esbuild unrs-resolver

      # 以下均用 pnpm exec 直接执行，不经过 pnpm 的脚本前置依赖校验
      - name: 类型检查
        run: pnpm exec tsc --noEmit

      - name: 代码检查
        run: pnpm exec next lint

      - name: 从源表重新生成数据
        run: pnpm exec tsx scripts/etl/build.ts

      - name: 数据校验
        run: pnpm exec tsx scripts/check-data.ts

      - name: 静态构建
        run: pnpm exec next build

      - name: 配置 Pages
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
